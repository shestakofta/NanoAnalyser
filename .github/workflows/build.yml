name: Build and release NanoAnalyzer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: windows, os: windows-latest, asset: NanoAnalyzer-Windows}
          - {target: mac-arm64, os: macos-15, asset: NanoAnalyzer-macOS-arm64}
          - {target: mac-intel, os: macos-15-intel, asset: NanoAnalyzer-macOS-Intel}
          - {target: linux, os: ubuntu-22.04, asset: NanoAnalyzer-Linux}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    defaults:
      run:
        shell: bash           # одинаковые команды на всех системах (в Windows — Git Bash)

    env:
      TARGET: ${{ matrix.target }}
      # Python везде пишет и читает текст в UTF-8: на машинах Windows вывод в журнал сборки
      # иначе идёт в cp1252, и любой print с русскими буквами останавливает сборку
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve settings
        # имя программы, значок, версия (из APP_VERSION в app.py) и имя архива
        run: |
          case "$TARGET" in
            mac-*)  APP="NPA ML";       ICON_FILE="NPA.icns" ;;
            windows) APP="NanoAnalyzer"; ICON_FILE="NPA.ico" ;;
            linux)  APP="NanoAnalyzer"; ICON_FILE="" ;;      # в Linux значок задаёт сама программа
            *) echo "::error::Неизвестная платформа $TARGET"; exit 1 ;;
          esac
          ICON=""
          if [ -n "$ICON_FILE" ]; then
            for p in "resources/$ICON_FILE" "$ICON_FILE"; do
              if [ -f "$p" ]; then ICON="$p"; break; fi
            done
            [ -n "$ICON" ] || echo "::warning::Значок $ICON_FILE не найден — сборка без значка"
          fi
          VERSION=$(python -c "import re; print(re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', open('app.py', encoding='utf-8').read()).group(1))")
          {
            echo "APP=$APP"
            echo "ICON=$ICON"
            echo "VERSION=$VERSION"
            echo "PKG=${{ matrix.asset }}"
          } >> "$GITHUB_ENV"
          echo "Платформа: $TARGET | программа: $APP | значок: ${ICON:-нет} | версия: $VERSION"

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libtk8.6 libtcl8.6 > /dev/null

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Check Python and Tk
        run: |
          python -c "import sys, platform; print(sys.version, platform.system(), platform.machine())"
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"
          python -c "import nanoproc, classify2, charts, export, ml_annot, circ8; print('modules OK')"

      - name: Embed About text
        # текст окна «О программе» берётся из resources/!infoabout.txt (или !infoabout.txt в корне)
        run: python make_about.py

      - name: Build app
        run: |
          EXTRA=()
          [ -n "$ICON" ] && EXTRA+=(--icon "$ICON")
          SEP=":"; [ "$RUNNER_OS" = "Windows" ] && SEP=";"     # разделитель --add-data: в Windows «;»
          [ -d resources ] && EXTRA+=(--add-data "resources${SEP}resources")
          [ "$RUNNER_OS" = "macOS" ] && EXTRA+=(--osx-bundle-identifier "ru.mipt.cifm.npa")
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --onedir \
            --name "$APP" \
            "${EXTRA[@]}" \
            --collect-submodules skimage \
            --collect-data skimage \
            --hidden-import tifffile \
            --hidden-import openpyxl \
            --hidden-import matplotlib.backends.backend_tkagg \
            --hidden-import matplotlib.backends.backend_agg \
            --hidden-import PIL._tkinter_finder \
            --hidden-import PIL.ImageTk \
            --hidden-import about_text \
            --hidden-import ml_annot \
            app.py

      - name: Locate executable
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            BIN="dist/$APP.app/Contents/MacOS/$APP"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            BIN="dist/$APP/$APP.exe"
          else
            BIN="dist/$APP/$APP"
          fi
          test -f "$BIN" || { echo "::error::Не найден $BIN"; exit 1; }
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          file "$BIN" || true
          du -sh dist/* || true

      - name: Smoke test (batch mode on a synthetic image)
        # Собранная программа в пакетном режиме (--batch) обрабатывает искусственный снимок:
        # проверяются все библиотеки внутри сборки, параллельная обработка и отчёты Excel.
        # Масштаб задаётся файлом nano_settings.json рядом с исполняемым файлом; после проверки он удаляется.
        timeout-minutes: 10
        run: |
          mkdir -p smoke_test
          python ci/make_test_image.py smoke_test
          SET="$(dirname "$BIN")/nano_settings.json"
          echo '{"nm_per_px": 0.5}' > "$SET"
          "$BIN" --batch smoke_test/out smoke_test/smoke.png
          rm -f "$SET"
          cat smoke_test/out/batch_log.txt
          grep -q "done: 1 of 1" smoke_test/out/batch_log.txt
          test -f smoke_test/out/otchet_kratkiy.xlsx
          echo "Проверка пройдена"

      # ---------------------------------------------------------------- упаковка
      - name: Sign and package (macOS)
        if: runner.os == 'macOS'
        # PyInstaller уже подписывает ad-hoc; повторная подпись всего пакета — для надёжности на Apple Silicon.
        # Если она не удалась, остаётся подпись PyInstaller (сборка не прерывается).
        run: |
          codesign --force --deep --sign - "dist/$APP.app" || echo "::warning::codesign failed, PyInstaller signature kept"
          codesign --verify --deep --verbose=1 "dist/$APP.app" || echo "::warning::codesign verify failed"
          cd dist
          ditto -c -k --keepParent "$APP.app" "$PKG.zip"
          echo "ARCHIVE=dist/$PKG.zip" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          7z a -tzip "$PKG.zip" "$APP" > /dev/null
          echo "ARCHIVE=dist/$PKG.zip" >> "$GITHUB_ENV"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        # tar.gz сохраняет права на запуск (zip их теряет)
        run: |
          cd dist
          tar -czf "$PKG.tar.gz" "$APP"
          echo "ARCHIVE=dist/$PKG.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: NanoAnalyzer-*
          path: release
          merge-multiple: true
      - name: Check assets and generate checksums
        working-directory: release
        run: |
          test -s NanoAnalyzer-Windows.zip
          test -s NanoAnalyzer-macOS-arm64.zip
          test -s NanoAnalyzer-macOS-Intel.zip
          test -s NanoAnalyzer-Linux.tar.gz
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "NanoAnalyzer $TAG" --generate-notes
          fi
          gh release upload "$TAG" release/* --clobber
          gh release edit "$TAG" --draft=false
