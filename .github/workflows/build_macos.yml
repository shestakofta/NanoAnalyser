
name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: intel
          - os: macos-15
            arch: arm64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build macOS app
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --onedir \
            --name "NPA ML" \
            --icon "resources/NPA.icns" \
            --add-data "resources:resources" \
            app.py

      - name: Verify bundle
        run: |
          test -d "dist/NPA ML.app"
          test -f "dist/NPA ML.app/Contents/MacOS/NPA ML"

      - name: Package app
        run: |
          cd dist
          ditto -c -k --keepParent \
            NPA ML.app \
            NPA ML-macos-${{ matrix.arch }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NPA ML-macos-${{ matrix.arch }}
          path: dist/NPA ML-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 30
